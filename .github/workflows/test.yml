name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q token_tracker
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/foundry/core.test.mjs tests/foundry/module.test.mjs
      - run: python -m token_tracker.cli --help
      - run: python -m token_tracker.session --help
      - run: python -m token_tracker.dataset --help
      - run: python -m token_tracker.external_dataset --help
      - run: bash -n scripts/train-nova.sbatch
        if: runner.os == 'Linux'
      - run: python -m token_tracker.dashboard --help
      - run: python -m token_tracker.replay examples/replay.jsonl --columns 12 --rows 8
      - run: python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: python tests/browser_checks.py
        if: runner.os == 'Linux'
